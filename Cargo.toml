[package]
name = "irisstudio"
version = "1.0.0"
description = "IrisStudio : studio de création musicale (séquenceur, piano roll, playlist, mixeur, synthés) avec cours, moteur audio en Rust"
edition = "2021"
default-run = "irisstudio"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# briques partagées (../iris-briques, publiées sur github.com/Iris-universe/iris-briques)
iris-decode = { git = "https://github.com/Iris-universe/iris-briques" }
iris-store = { git = "https://github.com/Iris-universe/iris-briques" }
iris-link = { git = "https://github.com/Iris-universe/iris-briques" }
tauri = { version = "2", features = ["custom-protocol", "devtools"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"
rtrb = "0.3"
hound = "3"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros", "sync"] }
rfd = "0.15"
dirs = "5"
png = "0.17"
chrono = "0.4"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_Com",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 2
